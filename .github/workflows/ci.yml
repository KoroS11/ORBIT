name: CI / Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Build
        run: npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/koros11/orbit-backend:latest
            ghcr.io/koros11/orbit-backend:${{ github.sha }}

      - name: Build and push Frontend / Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_CESIUM_ION_TOKEN=${{ secrets.VITE_CESIUM_ION_TOKEN }}
            VITE_ARCGIS_API_KEY=${{ secrets.VITE_ARCGIS_API_KEY }}
          tags: |
            ghcr.io/koros11/orbit-frontend:latest
            ghcr.io/koros11/orbit-frontend:${{ github.sha }}
            ghcr.io/koros11/orbit-caddy:latest
